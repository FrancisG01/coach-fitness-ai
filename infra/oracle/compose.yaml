# Servidor Oracle (`coach`): servicios de producción.
# Se despliega con infra/oracle/desplegar.sh; ver infra/oracle/README.md y ADR 0020.
name: coach

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    # Usuario deploy (uid 1002), sin root. tailscaled le permite pedir
    # certificados y nada más (TS_PERMIT_CERT_UID=1002 en /etc/default/tailscaled).
    user: "1002:1002"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # Red del host para escuchar solo en la IP de Tailscale (ver Caddyfile):
    # con puertos publicados, Docker se saltaría el firewall del sistema.
    network_mode: host
    environment:
      COACH_HOST: coach.tail72ec86.ts.net
      COACH_BIND_IP: 100.105.148.38
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      # Carpeta y no el socket suelto: tailscaled lo recrea al reiniciarse.
      - /var/run/tailscale:/var/run/tailscale
      - ./caddy/data:/data
      - ./caddy/config:/config
